# Canonical spec keys per category, derived from the 32 datasheets in data/raw (B-05).
#
# Each key is extracted (in this precedence) from:
#   aliases   - lowercase labels: "Key Specifications Summary" keys (e.g. `rate`) or prose labels ("maximum sampling rate")
#   patterns  - regexes over the datasheet text; group 1 is the raw value
#   keywords  - (type list) every keyword found in the text becomes a list item
# type: number | string | boolean | list | range (range -> <key>_min and <key>_max numbers)
# unit: canonical unit; values with a convertible unit are converted, incompatible units are discarded.
# critical: participates in critical compatibility rules (missing ⇒ UNKNOWN, mismatch ⇒ INCOMPATIBLE).
# compare (compatibility engine): gte | lte | eq | interface | has_all | intersects | contains (ranges)
#   defaults: number→gte, range→contains, list→has_all, string/boolean→eq
# derive: false → the original's value is informative only (not turned into a requirement)
# upgrade_condition: when the candidate exceeds the original on this key, compatibility holds only
#   with this condition (R-UPGRADE). Placeholders: {original} {candidate} {unit}
version: "1.1.0"

common:
  subcategory:       {type: string, derive: false, description: "Second part of the datasheet 'Category: X / Y' header"}
  datasheet_status:  {type: string, derive: false, aliases: [product status], description: "Informative only; the catalog is the source of truth"}
  document_revision: {type: string, derive: false, aliases: [document revision]}

categories:
  CPU:
    cores:          {unit: count, type: number, aliases: [cores], patterns: ['(\d+)-core']}
    threads:        {unit: count, type: number, aliases: [threads], patterns: ['(\d+)-thread']}
    base_clock:     {unit: GHz, type: number, aliases: [base, base frequency, base clock]}
    turbo_clock:    {unit: GHz, type: number, aliases: [turbo, max turbo]}
    l1_cache:       {unit: KB, type: number, aliases: [cache_l1]}
    l2_cache:       {unit: KB, type: number, aliases: [cache_l2]}
    l3_cache:       {unit: MB, type: number, aliases: [l3, l3 cache]}
    memory_channels: {unit: count, type: number, aliases: [ddr5]}
    pcie_lanes:     {unit: count, type: number, aliases: [pcie5, pcie 5.0]}
    tdp:            {unit: W, type: number, compare: lte, aliases: [tdp]}
    socket:         {type: string, critical: true, patterns: ['Socket (\w+)']}
    architecture:   {type: string, critical: true, aliases: [arch], patterns: ['(Armv[\d.]+-?A)', '(Zen \d)'],
                     description: "ISA/microarchitecture: ARM vs x86 is never a drop-in replacement"}

  DAQ:
    analog_inputs:  {unit: count, type: number, critical: true, aliases: [channels], description: "canales / entradas analógicas", patterns: ['(\d+) single-ended']}
    resolution:     {unit: bit, type: number, critical: true, aliases: [resolution]}
    sample_rate:    {unit: S/s, type: number, critical: true, description: "velocidad de muestreo", aliases: [rate, maximum sampling rate, maximum sample rate]}
    analog_outputs: {unit: count, type: number, aliases: [ao], description: "salidas analógicas", patterns: ['(\w+) (?:\d+-bit )?analog outputs']}
    digital_io:     {unit: count, type: number, aliases: [dio], description: "líneas digitales de E/S (no son canales analógicos)", patterns: ['(\d+) digital I/O']}
    counters:       {unit: count, type: number, aliases: [counters], patterns: ['(\w+) (?:\d+-bit )?counter']}
    host_interface: {type: string, critical: true, compare: interface, aliases: [interface], patterns: ['(USB \d\.\d)']}
    simultaneous:   {type: boolean, aliases: [simultaneous]}
    supply_voltage: {unit: V, type: number, aliases: [supply]}

  FPGA:
    logic_cells:      {unit: count, type: number, critical: true, aliases: [logic_cells], patterns: ['([\d.,]+ million) logic elements', '([\d,]+) logic cells', '([\d,]+) LUTs']}
    block_ram:        {unit: Kb, type: number, aliases: [bram]}
    dsp_blocks:       {unit: count, type: number, aliases: [dsp]}
    transceivers:     {unit: count, type: number, aliases: [transceivers]}
    transceiver_rate: {unit: Gb/s, type: number, aliases: [speed]}
    user_io:          {unit: count, type: number, aliases: [io]}
    process:          {type: string, derive: false, aliases: [process]}
    package:          {type: string, aliases: [package, package options]}

  GPU:
    memory_size:      {unit: GB, type: number, critical: true, aliases: [memory, hbm2e memory, hbm3 memory, hbm3], patterns: ['(\d+ GB) GDDR']}
    memory_type:      {type: string, patterns: ['\b(HBM\de?|GDDR\dX?)\b']}
    memory_bandwidth: {unit: GB/s, type: number, aliases: [bw, memory bandwidth], patterns: ['([\d,]+ GB/s) bandwidth']}
    fp64:             {unit: TFLOPS, type: number, aliases: [fp64, peak fp64]}
    fp32:             {unit: TFLOPS, type: number, aliases: [fp32, peak fp32]}
    cuda_cores:       {unit: count, type: number, aliases: [cuda, cuda cores]}
    tdp:              {unit: W, type: number, compare: lte, aliases: [tdp]}
    host_interface:   {type: string, compare: interface, aliases: [pcie, host interface], patterns: ['(PCIe Gen\d x\d+)']}
    form_factor:      {type: list, critical: true, compare: intersects, aliases: [form factor, form factors]}
    interconnect:     {type: list, keywords: [NVLink, NVSwitch, Infinity Fabric]}

  Memory:
    memory_type:  {type: string, critical: true, patterns: ['\b(LPDDR5X|DDR5|HBM3)\b']}
    capacity:     {unit: GB, type: number, critical: true, aliases: [capacity, density]}
    data_rate:    {unit: MT/s, type: number, aliases: [speed]}
    voltage:      {unit: V, type: number, critical: true, aliases: [voltage, vdd/vddq]}
    bandwidth:    {unit: GB/s, type: number, aliases: [bw]}
    ecc:          {type: string, derive: false, aliases: [ecc, on-die ecc]}
    package:      {type: string, aliases: [package]}

  Microcontroller:
    core:           {type: string, aliases: [core, cores], description: "Different core ⇒ firmware port (condition)"}
    clock:          {unit: MHz, type: number, aliases: [freq]}
    flash:          {unit: KB, type: number, aliases: [flash]}
    sram:           {unit: KB, type: number, critical: true, aliases: [sram]}
    gpio:           {unit: count, type: number, aliases: [gpio]}
    usb:            {type: string, aliases: [usb]}
    wireless:       {type: list, keywords: [Wi-Fi, Bluetooth],
                     synonyms: {Wi-Fi: [wifi, wi fi, wlan, '802.11'], Bluetooth: [ble, bluetooth le]}}
    interfaces:     {type: list, keywords: [UART, SPI, I2C, I2S, CAN, FDCAN, Ethernet]}
    supply_voltage: {unit: V, type: range, aliases: [supply], description: "Only stated by some datasheets"}
    package:        {type: string, aliases: [package]}

  Network:
    port_speed:     {unit: Gb/s, type: number, critical: true, aliases: [speed, port speed, port configuration],
                     upgrade_condition: "Puertos de {candidate} {unit} (original {original} {unit}): validar ópticas/switch o usar breakout"}
    ports:          {unit: count, type: number, aliases: [ports]}
    host_interface: {type: string, critical: true, compare: interface, aliases: [pcie, host interface], patterns: ['(PCIe \d\.\d x\d+) host interface']}
    sriov_vfs:      {unit: count, type: number, aliases: [sriov, sr-iov]}
    rdma:           {type: list, keywords: [RoCE v2, iWARP, InfiniBand], synonyms: {RoCE v2: [roce, rocev2, roce2]}}
    offloads:       {type: list, keywords: [IPsec, TLS, VXLAN, GENEVE, NVGRE, GRE, OVS, NVMe-oF],
                     synonyms: {IPsec: [ipsec offload, cifrado ipsec], TLS: [ssl, tls offload], NVMe-oF: [nvme over fabrics]}}
    connector:      {type: string, patterns: ['\b(QSFP\d+)\b']}
    tdp:            {unit: W, type: number, compare: lte, aliases: [tdp]}

  Power:
    subcategory:         {type: string, critical: true, description: "Function (VRM, USB PD controller...) from the Category header"}
    output_current:      {unit: A, type: number, critical: true, aliases: [current, continuous output current]}
    input_voltage:       {unit: V, type: range, critical: true, aliases: [vin, input voltage]}
    output_voltage:      {unit: V, type: range, critical: true, aliases: [vout, output voltage]}
    switching_frequency: {unit: kHz, type: range, aliases: [freq]}
    efficiency:          {unit: pct, type: number, aliases: [efficiency, peak efficiency]}
    phases:              {unit: count, type: number, aliases: [phases]}
    power_delivery:      {unit: W, type: number, aliases: [power_delivery]}
    usb_pd:              {type: string, aliases: [usb_pd]}
    interface:           {type: string, aliases: [interface]}
    package:             {type: string, aliases: [package]}

  Sensor:
    measurands: {type: list, critical: true, keywords: [gas, pressure, humidity, temperature, gyroscope, accelerometer],
                 synonyms: {gas: [gases, gases volatiles, voc, compuestos organicos volatiles, calidad del aire],
                            pressure: [presion, presion barometrica, barometro], humidity: [humedad, humedad relativa],
                            temperature: [temperatura], gyroscope: [giroscopio, giroscopo, gyro, rotacion],
                            accelerometer: [acelerometro, aceleracion, accel]}}
    interface:  {type: list, critical: true, compare: intersects, keywords: [I2C, SPI]}
    dof:        {type: string, aliases: [dof]}
    package:    {type: string, patterns: ['\b(LGA|QFN)\b']}

  Storage:
    capacity:    {unit: TB, type: number, critical: true, aliases: [capacity]}
    interface:   {type: string, critical: true, compare: interface, aliases: [interface]}
    form_factor: {type: string, critical: true, patterns: ['\b(U\.2|M\.2)\b']}
    seq_read:    {unit: MB/s, type: number, aliases: [seq_read, sequential read]}
    seq_write:   {unit: MB/s, type: number, aliases: [seq_write, sequential write]}
    rand_read:   {unit: IOPS, type: number, aliases: [rand_read]}
    endurance:   {unit: DWPD, type: number, aliases: [endurance]}
    nand:        {type: string, derive: false, aliases: [nand]}
