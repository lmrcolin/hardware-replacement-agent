# Tema del agente: neutro y sobrio; el acento verde azulado identifica al agente.
# Colores de componentes propios en app/components/theme.py.
[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F6F8FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F2933"
linkColor = "#0F766E"
borderColor = "#DDE3E8"
baseRadius = "medium"
showWidgetBorder = true

[client]
toolbarMode = "minimal"
