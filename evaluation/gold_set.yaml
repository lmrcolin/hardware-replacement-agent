# Gold set for `make eval`. Expectations come from the PDFs in data/raw (catalog + datasheets), never from
# the system's own output. Each case says why in `notes`.
#
# Schema (validated by evaluation/run_eval.py):
#   id                  unique case id
#   query               customer text (es/en)
#   expected_original   part number the agent must resolve (null = no single part: find by requirements / clarify)
#   expected_status     catalog status of expected_original
#   expected_top        acceptable ACTIVE substitutes; the #1 confirmed recommendation must be one of them.
#                       []   = no confirmed (COMPATIBLE / COMPATIBLE_WITH_CONDITIONS) recommendation expected
#                       null = not evaluated (e.g. the part is still ACTIVE)
#   expected_level      level of the #1 recommendation (null = not evaluated)
#   must_not_recommend  part numbers that must never appear among recommendations
#   expect_clarification
#   clarification_mentions  part numbers the clarification question must suggest
#   relevant_documents  datasheets a retriever should surface for this query (retrieval metrics); [] = skip
#   verified_by         who checked the expectation against the PDFs
#   notes               justification with the source
version: "1.0.0"
cases:
  # ---------------------------------------------------------------- official case and variants
  - id: GS-01
    query: "Necesito una tarjeta de red 100 Gigabit Ethernet con soporte RDMA y offload de IPsec. Usábamos la Intel E810 pero ya no la encuentro"
    expected_original: E810-CQDA2
    expected_status: DISCONTINUED
    expected_top: [MCX75310AAS-NEAT, BCM57508]
    expected_level: COMPATIBLE_WITH_CONDITIONS
    must_not_recommend: [E810-CQDA2]
    expect_clarification: false
    relevant_documents: [Intel_E810_100GbE_NIC.pdf, NVIDIA_ConnectX-7_400GbE_SmartNIC.pdf, broadcom-bcm57508-datasheet.pdf]
    verified_by: "lmrcolin + asistente (revisión de PDFs; pendiente validación de experto)"
    notes: "Caso oficial. Aviso de la E810: 'consider NVIDIA ConnectX-7 (MCX75310AAS-NEAT)… Alternatively, Broadcom BCM57508'. Ambos ACTIVE, RDMA RoCE v2 e IPsec. Más velocidad (400/200 GbE) cambia ópticas/switch ⇒ con condiciones."
