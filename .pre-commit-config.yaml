repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=2048"]
        exclude: ^data/raw/


  # gitleaks is a Go binary (not on PyPI); pre-commit bootstraps it.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ruff runs from the project venv so the hook and `make lint` use the same version (uv.lock).
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: import-linter
        name: import-linter (dependency direction)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        files: ^src/advisor/
