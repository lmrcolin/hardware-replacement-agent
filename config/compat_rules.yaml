# Rule declarations. Evaluation lives in src/advisor/compatibility/engine.py (B-15).
# The severity below is the rule's default; per requirement it comes from its priority/origin:
#   query MUST or critical spec of the original → CRITICAL; SHOULD / non-critical spec → MAJOR; NICE → MINOR.
# Aggregation: CRITICAL FAIL ⇒ INCOMPATIBLE; CRITICAL MISSING ⇒ UNKNOWN;
#              MAJOR FAIL/MISSING or any CONDITIONAL ⇒ COMPATIBLE_WITH_CONDITIONS; otherwise COMPATIBLE.
version: "1.0.0"
rules:
  - id: R-CAT
    name: Same category
    description: Candidate must belong to the same catalog category as the original.
    severity: CRITICAL
    applies_to: ["*"]
  - id: R-FF
    name: Form factor / package
    description: Physical form factor, connector or package must match (adapters make it conditional, never silent).
    severity: CRITICAL
    applies_to: [GPU, Storage, Network, Microcontroller, FPGA, Power, Sensor]
  - id: R-MUST-PROTO
    name: Mandatory protocols and features
    description: Every MUST protocol/feature requested (e.g. RDMA, IPsec offload, I2C) must be present (HAS).
    severity: CRITICAL
    applies_to: ["*"]
  - id: R-ELEC
    name: Electrical compatibility
    description: Supply/input voltage ranges must contain the required ones; power/TDP within the original envelope.
    severity: CRITICAL
    applies_to: [CPU, GPU, Memory, Microcontroller, Power, Sensor, DAQ]
  - id: R-IFACE
    name: Host interface
    description: Same interface family (PCIe, USB). Same generation passes; a newer generation is backward compatible (COMPATIBLE_WITH_CONDITIONS); an older one or another family fails.
    severity: CRITICAL
    applies_to: [Network, GPU, DAQ, Storage]
  - id: R-SPEC
    name: Categorical spec equality
    description: Non-physical categorical specs (memory type, architecture, core) must match; otherwise a condition or failure depending on the requirement severity.
    severity: MAJOR
    applies_to: ["*"]
  - id: R-NUM-GTE
    name: Numeric capability not lower
    description: Capacity/performance specs (speed, channels, memory, resolution) must be >= the requirement.
    severity: MAJOR
    applies_to: ["*"]
  - id: R-UPGRADE
    name: Acceptable upgrade
    description: Higher capability that changes integration (e.g. 100GbE → 200/400GbE, PCIe gen) yields COMPATIBLE_WITH_CONDITIONS with explicit conditions.
    severity: MINOR
    applies_to: ["*"]
  - id: R-MISSING
    name: Missing data
    description: A required spec absent in the candidate's evidence is reported as missing; never treated as a match.
    severity: CRITICAL
    applies_to: ["*"]
