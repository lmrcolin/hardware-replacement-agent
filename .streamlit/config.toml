# Tema del agente: claro siempre, azul rey Emerson. Tokens y componentes: app/static/design.css.
[theme]
base = "light"
primaryColor = "#2741C4"
backgroundColor = "#FBFBFD"
secondaryBackgroundColor = "#F2F2F5"
textColor = "#1D1D1F"
linkColor = "#2741C4"
borderColor = "#E5E5EA"
baseRadius = "10px"
showWidgetBorder = false
showSidebarBorder = false
font = "-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, 'Segoe UI', system-ui, sans-serif"
baseFontSize = 15

[theme.sidebar]
backgroundColor = "#F5F5F7"
secondaryBackgroundColor = "#EBEBEF"

[client]
toolbarMode = "minimal"
