[project]
name = "emerson-advisor"
version = "0.1.0"
description = "Emerson Replacement Advisor: agentic recommendation of active substitutes for discontinued parts."
requires-python = "==3.12.*"
dependencies = [
    "pydantic>=2.9",
    "networkx>=3.3",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.9",
    "sentence-transformers>=3.0",
    # CPU-only wheel (see [tool.uv.sources]); avoids multi-GB CUDA downloads.
    "torch>=2.4",
    "faiss-cpu>=1.8",
    "streamlit>=1.40",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "databricks-sdk>=0.30",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "pre-commit>=4.0",
    "import-linter>=2.1",
]

[project.scripts]
advisor-pipeline = "advisor.pipeline:main"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra --strict-markers"
xfail_strict = true
markers = [
    "contract: model and import-direction contracts (must always pass)",
    "stub: module contract not implemented yet (xfail until implemented)",
    "integration: multi-module tests over fixtures",
    "data: tests over the real PDFs in data/raw",
    "safety: negative tests guarding against technically dangerous recommendations",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# Notebooks are formatted by their authors/Databricks; lint still applies.
exclude = ["databricks/notebooks/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
ignore_missing_imports = true

# Dependency direction (higher layers may import lower ones, never the reverse).
# Mirrored by tests/contracts/test_imports.py so `pytest` alone also catches violations.
[tool.importlinter]
root_package = "advisor"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "advisor.pipeline",
    "advisor.agent",
    "advisor.recommendation | advisor.llm",
    "advisor.compatibility | advisor.commercial | advisor.retrieval",
    "advisor.kg",
    "advisor.chunking | advisor.enrichment",
    "advisor.extraction",
    "advisor.parsing",
    "advisor.ingestion",
    "advisor.repository",
    "advisor.models | advisor.config",
]

[[tool.importlinter.contracts]]
name = "Compatibility engine is deterministic (no LLM, no retrieval)"
type = "forbidden"
source_modules = ["advisor.compatibility", "advisor.recommendation"]
forbidden_modules = ["advisor.llm", "advisor.retrieval", "httpx", "databricks"]
